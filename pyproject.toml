[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metalml"
version = "0.2.1"
description = "Scikit-learn-compatible machine learning with Apple's Metal GPU backend"
readme = "README.pypi.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["machine-learning", "scikit-learn", "metal", "apple-silicon", "gpu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.6,<1.8",
  "pyobjc-framework-Metal>=10; sys_platform == 'darwin'",
  "pyobjc-framework-MetalPerformanceShaders>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["build", "ruff", "twine"]

[project.urls]
Repository = "https://github.com/tudor-22/MetalML"
Issues = "https://github.com/tudor-22/MetalML/issues"

[tool.setuptools.packages.find]
include = ["metalml*"]

[tool.setuptools.package-data]
metalml = ["_metal/*.metal"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
